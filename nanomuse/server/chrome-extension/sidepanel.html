<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniMuse Side Panel</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid #21262d;
      background: #161b22;
      flex-shrink: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #8b949e;
      flex-shrink: 0;
    }
    .dot.on { background: #3fb950; }
    .dot.shared { background: #2f81f7; box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.25); }
    .meta {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      line-height: 1.25;
    }
    .meta .title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta .sub {
      color: #8b949e;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      border: 1px solid #30363d;
      background: #21262d;
      color: #f0f6fc;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    button.primary {
      background: #1f6feb;
      border-color: #388bfd;
    }
    button.danger {
      background: #da3633;
      border-color: #f85149;
    }
    .settings {
      padding: 10px;
      background: #161b22;
      border-bottom: 1px solid #21262d;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }
    .settings.open { display: flex; }
    .settings input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #f0f6fc;
      font-size: 12px;
    }
    .err {
      padding: 6px 10px;
      background: rgba(248, 81, 73, 0.14);
      color: #ff7b72;
      font-size: 11px;
      display: none;
    }
    .err.open { display: block; }
    iframe {
      border: 0;
      width: 100%;
      flex: 1;
      background: #0d1117;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span id="dot" class="dot"></span>
    <div class="meta">
      <div id="statusTitle" class="title">MiniMuse Companion</div>
      <div id="statusSub" class="sub">Connecting to local server...</div>
    </div>
    <button id="shareBtn" class="primary" type="button">Share Tab</button>
    <button id="gearBtn" type="button" title="Server settings">Setup</button>
  </div>
  <div id="errBox" class="err"></div>
  <div id="settingsBox" class="settings">
    <label>
      MiniMuse Server URL
      <input id="serverInput" type="text" placeholder="http://127.0.0.1:8787" />
    </label>
    <label>
      Access Token (optional)
      <input id="tokenInput" type="password" placeholder="Leave blank on localhost" />
    </label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="saveBtn" class="primary" type="button">Save & Reconnect</button>
    </div>
  </div>
  <iframe id="appFrame" allow="microphone; clipboard-read; clipboard-write"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
