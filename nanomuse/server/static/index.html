    <script>
      // light or dark follows the system (a pinned background colour decides); applied
      // before the first paint so a dark look does not flash white
      try {
        var srv = window.__NM_SERVER_UI__;
        var bg = localStorage.getItem("nanomuse_bg") || "";
        if (bg.toLowerCase() === "#000000") {
          localStorage.removeItem("nanomuse_bg");
          bg = "";
        }
        if (srv && typeof srv === "object" && typeof srv.bg === "string") {
          if (/^#[0-9a-fA-F]{6}$/.test(srv.bg)) {
            bg = srv.bg.toLowerCase();
            localStorage.setItem("nanomuse_bg", bg);
          } else if (srv.bg === "") {
            bg = "";
            localStorage.removeItem("nanomuse_bg");
          }
        }
        var t = "light", color = "";
        if (/^#[0-9a-fA-F]{6}$/.test(bg)) {
          var r = parseInt(bg.slice(1, 3), 16) / 255;
          var g = parseInt(bg.slice(3, 5), 16) / 255;
          var b = parseInt(bg.slice(5, 7), 16) / 255;
          var f = function (c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
          var lum = 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
          t = lum < 0.4 ? "dark" : "light";
          color = bg;
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        var barColor = color || (t === "dark" ? "#181819" : "#ffffff");
        document.documentElement.style.backgroundColor = barColor;
        document.documentElement.style.setProperty("--om-bg", barColor);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", barColor);
        var look = t + ":" + (color || "");
        document.cookie = "nm_look=" + look + "; path=/; max-age=31536000; samesite=lax";
      } catch (e) {}
    </script>
